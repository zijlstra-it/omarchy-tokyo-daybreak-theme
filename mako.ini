include=~/.local/share/omarchy/default/mako/core.ini

# Tokyo Daybreak — Tokyo Day notification cards
text-color=#080808
border-color=#3760bf
background-color=#e9ecf5
progress-color=over #3760bf
padding=12
border-size=2
border-radius=0
font=JetBrains Mono 10
max-icon-size=36
outer-margin=18

[urgency=low]
text-color=#596583
border-color=#929db8

[urgency=normal]
text-color=#080808
border-color=#3760bf

[urgency=critical]
text-color=#ad3459
border-color=#ad3459
background-color=#e9ecf5
