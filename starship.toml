# Tokyo Daybreak — Starship prompt in Tokyo Night colors.
add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold #7aa2f7"
format = "[$path]($style) "
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
symbol = "⌁ "
style = "#ad8ee6"
format = "[$symbol$branch]($style) "

[git_status]
style = "#f7768e"
format = "([$all_status$ahead_behind]($style)) "

[cmd_duration]
min_time = 2000
style = "#565f89"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #ad8ee6)"
