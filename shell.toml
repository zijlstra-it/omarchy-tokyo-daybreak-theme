# Tokyo Daybreak — Omarchy Quattro surfaces.
# Light Tokyo Day bar and panels; terminals keep the dark Tokyo Night palette
# from colors.toml (foot.ini is dark in both [colors] and [colors-dark]).

[bar]
background = "#e9ecf5"
background-alpha = 1.0
text = "#080808"
active = "#3760bf"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "#3760bf"
active-border-foreground = "#3760bf"

[controls]
normal-color = "#596583"
normal-fill-alpha = 0.12
normal-border-width = 1
normal-border-alpha = 0.50

hover-cursor-color = "#3760bf"
hover-cursor-fill-alpha = 0.12
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.70

focus-color = "#3760bf"
focus-fill-alpha = 0.10
focus-border-width = 1
focus-border-alpha = 0.90

selected-color = "#3760bf"
selected-fill-alpha = 0.16
selected-border-width = 1
selected-border-alpha = 0.70

pressed-color = "#303c60"
pressed-fill-alpha = 0.16
selection-color = "#3760bf"
selection-fill-alpha = 0.45

[spacing]
scale = 1.0
scale-with-font = true
xs = 2
md = 4
control-padding-y = 5
panel-padding = 10

[font]
base-size = 12
heading = 16
icon-large = 18

[popups]
background = "#e9ecf5"
background-alpha = 1.0
text = "#080808"
border = "#3760bf"
border-alpha = 1.0
border-width = 2

[tooltip]
background = "#e9ecf5"
background-alpha = 1.0
text = "#080808"
border = "#3760bf"
border-alpha = 0.90
border-width = 1

[notifications]
background = "#e9ecf5"
background-alpha = 1.0
text = "#080808"
border = "#3760bf"
border-alpha = 1.0
border-width = 2
countdown = "#3760bf"

[launcher]
background = "#e9ecf5"
background-alpha = 1.0
text = "#080808"
border = "#929db8"
border-alpha = 1.0
border-width = 2
scrim = "#253252"
scrim-alpha = 0.20
selected-background = "#c4d2f0"
selected-background-alpha = 1.0
selected-text = "#283457"
selected-border = "#3760bf"
selected-border-alpha = 1.0
selected-border-width = 1

[menu]
background = "#e9ecf5"
background-alpha = 1.0
text = "#080808"
border = "#929db8"
border-alpha = 1.0
border-width = 2
scrim = "#253252"
scrim-alpha = 0.20
selected-background = "#c4d2f0"
selected-background-alpha = 1.0
selected-text = "#283457"
selected-border = "#3760bf"
selected-border-alpha = 1.0
selected-border-width = 1

[polkit]
background = "#e9ecf5"
background-alpha = 1.0
text = "#080808"
text-error = "#ad3459"
border = "#3760bf"
border-error = "#ad3459"
border-alpha = 1.0
border-width = 2
scrim = "#e9ecf5"
scrim-alpha = 0.5
accent = "#3760bf"

[lock]
background = "#e9ecf5"
background-alpha = 0.8
text = "#080808"
placeholder = "#596583"
text-error = "#ad3459"
border = "#3760bf"
border-active = "#3760bf"
border-error = "#ad3459"
border-alpha = 1.0
border-width = 2
selection = "#3760bf"
selection-alpha = 0.45

[image-picker]
scrim = "#e9ecf5"
scrim-alpha = 0.5
text = "#080808"
selected-border = "#3760bf"
selected-border-alpha = 1.0
unselected-border = "#596583"
unselected-border-alpha = 0.28
