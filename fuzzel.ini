# Fuzzel alternative launcher profile; Omarchy's default launcher is Walker.
[main]
font=JetBrainsMono Nerd Font:size=12
prompt=TOKYO DAYBREAK  
terminal=kitty
layer=overlay
width=62
lines=12
horizontal-pad=20
vertical-pad=16
inner-pad=8
line-height=24
icon-theme=Adwaita
show-actions=yes

[colors]
background=e9ecf5ff
text=080808ff
match=3760bfff
selection=c4d2f0ff
selection-text=283457ff
selection-match=3760bfff
border=929db8ff

[border]
width=2
radius=0
