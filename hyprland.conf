# Tokyo Daybreak — compositor surface (Tokyo Day borders)
general {
    col.active_border = rgb(3760bf)
    col.inactive_border = rgba(929db888)
    border_size = 2
    gaps_in = 8
    gaps_out = 18
}

group {
    col.border_active = rgb(3760bf)
    col.border_inactive = rgba(929db888)
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.98
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(3760bf22)
        color_inactive = rgba(08080808)
    }
}
